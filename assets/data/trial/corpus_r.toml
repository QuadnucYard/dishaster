summary = "温度控制与赔偿"
text = '对于过烫或过冷的问题我们会检视出餐流程并对受影响顾客提供补偿或替代餐。'
emotion = "🙂"

[[item]]
kind = "objection"
summary = "学生价核对流程"
text = '学生价核对需要凭证，我们会现场协助核对并按规定补差或退费给符合条件的同学。'
emotion = "🙂"

[[item]]
kind = "agreement"
summary = "下架不合格食材"
text = '如发现食材不新鲜我们会立刻下架并追溯供货批次，\并对责任供应商采取处理措施。'
emotion = "😠"

[[item]]
kind = "question"
summary = "希望怎样补救？"
text = '您更倾向于现场更换、退款还是其他形式的补偿？'
emotion = "🤔"

[[item]]
kind = "agreement"
summary = "更正价格并退款"
text = '若发现标价错误我们会当场更正并把多收费用退回给您，\并向您致歉。'
emotion = "🙂"

[[item]]
kind = "objection"
summary = "检查清洗流程"
text = '关于粥里沙粒或餐具油渍我们会检查清洗流程并对相关环节整改，\同时对受影响的顾客提供补偿。'
emotion = "🤨"
gesture = "🧽"

[[item]]
kind = "agreement"
summary = "医疗与赔付协助"
text = '如因坚硬物伤及牙齿或身体我们会协助联系医务并讨论相应赔付方案。'
emotion = "😔"

[[item]]
kind = "question"
summary = "需要我们协助证明吗？"
text = '若您需要我们可以提供处理记录或证明以便您用于后续申诉或理赔。'
emotion = "🤔"
gesture = "📄"

[[item]]
kind = "objection"
summary = "改进排队机制"
text = '为避免高峰拥堵我们会调整窗口调度并优化排队路线，\减少排队时间并保护顾客安全。'
emotion = "🙂"

[[item]]
kind = "agreement"
summary = "改进出品质量"
text = '遇到过咸或口味波动的反馈我们会复查配方与操作，\并在短期内调整以恢复稳定口味。'
emotion = "🙂"

[[item]]
kind = "objection"
summary = "说明过敏与标注"
text = '对过敏问题我们会核实菜单标注并加强过敏信息提示，\确保类似错误不会再次发生。'
emotion = "🤨"

[[item]]
kind = "agreement"
summary = "现场换餐并免单"
text = '对于出现质量问题的餐品我们可以立即为您更换一份并免去费用，\以示歉意。'
emotion = "😔"
gesture = "🎁"

[[item]]
kind = "question"
summary = "是否需要监控回放？"
text = '在发生争议时我们可以调取监控回放以核实当时情况，\请告知是否同意我们这么做。'
emotion = "🤔"
gesture = "📹"

[[item]]
kind = "agreement"
summary = "加强后厨管理"
text = '针对不戴手套或抽烟等违规行为我们会立刻整顿并加强监督，\保证食品安全。'
emotion = "😠"
gesture = "🔒"

[[item]]
kind = "objection"
summary = "说明退款时限"
text = '退款需要一定流程与时间，我们会尽量加快并把进度告知您，\如遇延迟会提供临时补偿。'
emotion = "🤨"
gesture = "⏳"

[[item]]
kind = "agreement"
summary = "回收并检验可疑批次"
text = '如发现可疑异物或质量问题我们会回收整批并送检，\结果出来后会反馈处理措施。'
emotion = "🤨"
gesture = "🔬"

[[item]]
kind = "question"
summary = "希望怎样公开结果？"
text = '您希望我们通过公告栏、在线渠道还是私下通知来公布检测与处理结果？'
emotion = "🤔"
gesture = "📢"

[[item]]
kind = "objection"
summary = "处理投诉渠道"
text = '我们会提供多渠道投诉与追踪方式，\确保每个投诉都能被落实与跟进。'
emotion = "🙂"
gesture = "📬"

[[item]]
kind = "agreement"
summary = "安排安保与秩序维护"
text = '针对门口秩序混乱的情况我们会协调安保加派人手，\并完善突发事件应对机制。'
emotion = "🙂"
gesture = "👉"

[[item]]
kind = "agreement"
summary = "下架霉变水果并更换"
text = '发现发霉的水果我们会立刻下架并为您更换或退款，\并追查进货与保鲜流程。'
emotion = "😠"
gesture = "🛑"

[[item]]
kind = "question"
summary = "是否需要书面材料？"
text = '若您需要书面证明或处理回执，我们可以在处理后提供，\请告知收件方式。'
emotion = "🤔"
gesture = "📄"

[[item]]
kind = "objection"
summary = "公开整改计划"
text = '我们会在整改后发布阶段性报告并接受监督，\确保改进落到实处。'
emotion = "🙂"
gesture = "📢"

[[item]]
kind = "agreement"
summary = "改进服务与培训"
text = '我们会对窗口人员进行服务与卫生培训并检查执行情况，\以提升整体就餐体验。'
emotion = "🙂"
gesture = "🎓"

[[item]]
kind = "question"
summary = "是否需要联系我们？"
text = '在处理期间是否需要我们的负责人直接与您联系以便沟通细节？'
emotion = "🤔"
gesture = "📞"

[[item]]
kind = "agreement"
summary = "提供临时餐券"
text = '为补偿不便我们会赠送临时餐券或折扣，\方便您下次就餐使用。'
emotion = "🙂"

[[item]]
kind = "objection"
summary = "加强库存管理"
text = '针对断货与特供卖完的问题我们会优化库存与供应链管理，\减少缺货情况。'
emotion = "🙂"

[[item]]
kind = "agreement"
summary = "道歉并承诺改善"
text = '对于给您带来的不便我们深表歉意，\并承诺会在规定时间内完成整改。'
emotion = "😔"
gesture = "🙏"

[[item]]
kind = "question"
summary = "是否接受替代方案？"
text = '在我们处理期间您是否愿意接受替代餐或其他临时安排？'
emotion = "🤔"

[[item]]
kind = "agreement"
summary = "持续跟进"
text = '我们会把此事持续跟进直到彻底解决，\并把处理结果反馈给您。'
emotion = "🙂"
gesture = "🔔"

[[item]]
kind = "objection"
summary = "这是小题大作"
text = '这点小事不用夸大，\我们检查就行了。'
emotion = "😒"
gesture = "🙄"

[[item]]
kind = "objection"
summary = "不耐烦"
text = '我已经说了会处理，\麻烦您别一直重复。'
emotion = "😤"
gesture = "🤦"

[[item]]
kind = "agreement"
summary = "随便换一份"
text = '行，我换一份给你，\不过别太较真。'
emotion = "😏"
gesture = "🙄"

[[item]]
kind = "perjury"
summary = "否认责任"
text = '我们厨房一向按规矩做，\不可能出现那样的东西。'
emotion = "😒"
gesture = "🤥"

[[item]]
kind = "objection"
summary = "敷衍退款"
text = '行，退就退，\别再来添麻烦。'
emotion = "😒"
gesture = "👎"

[[item]]
kind = "question"
summary = "想怎么赔？"
text = '你想要什么赔偿，\说清楚我们再看能不能办。'
emotion = "😐"
gesture = "🤨"

[[item]]
kind = "objection"
summary = "别一上来就指责"
text = '别一上来就指责人，\大家都很忙。'
emotion = "😤"
gesture = "👎"

[[item]]
kind = "agreement"
summary = "勉强同意"
text = '好吧，我们可以再做一份，\但这是最后一次。'
emotion = "😒"
gesture = "🙄"

[[item]]
kind = "objection"
summary = "挑剔顾客"
text = '天啊，这也能挑刺，\我们也不是机器。'
emotion = "😒"
gesture = "🤦"

[[item]]
kind = "question"
summary = "要不要证据"
text = '要不你先把东西给我，\不然我怎么处理？'
emotion = "🤨"
gesture = "📎"

[[item]]
kind = "agreement"
summary = "冷淡换餐"
text = '换就换，\不过别怪我们慢。'
emotion = "😐"
gesture = "🤷"

[[item]]
kind = "objection"
summary = "不予受理"
text = '这类问题超过投诉期，\我们不再受理。'
emotion = "😠"
gesture = "👎"

[[item]]
kind = "perjury"
summary = "拒绝承认"
text = '我们没发现过类似记录，\可能是误会。'
emotion = "😏"
gesture = "🤥"

[[item]]
kind = "agreement"
summary = "勉强退款"
text = '好，我退给你，\下次别这么冲。'
emotion = "😒"
gesture = "💳"

[[item]]
kind = "objection"
summary = "别挡道"
text = '别在这站着不走，\还有客户在排队。'
emotion = "😤"
gesture = "👮"

[[item]]
kind = "question"
summary = "要去投诉吗？"
text = '要投诉就去行政那边，\我们这儿能做的有限。'
emotion = "😐"
gesture = "📢"

[[item]]
kind = "agreement"
summary = "草率道歉"
text = '好吧，对不起，\你满意就好。'
emotion = "😔"
gesture = "🙇"

[[item]]
kind = "objection"
summary = "夸张"
text = '这明显夸大了事实，\别把小事弄大。'
emotion = "😒"
gesture = "👎"

[[item]]
kind = "question"
summary = "还要别的？"
text = '还需要我们做什么，\说吧。'
emotion = "🤨"
gesture = "❓"

[[item]]
kind = "agreement"
summary = "冷漠承诺"
text = '我会记下，\但不保证一定改。'
emotion = "😐"
gesture = "📝"

[[item]]
kind = "objection"
summary = "听起来像借口"
text = '这听起来像借口，\你要不把证据拿出来我们再谈。'
emotion = "😒"

[[item]]
kind = "agreement"
summary = "随便吧"
text = '随便您怎么处理，\我这里不会再多费力气了。'
emotion = "😑"

[[item]]
kind = "objection"
summary = "别扯了"
text = '别扯了，\这事儿就按照规矩来，不要找借口。'
emotion = "😤"
gesture = "🫰"

[[item]]
kind = "question"
summary = "还要我说几遍？"
text = '您还要我说几遍才能让人重视？\要不您把情况写清楚我们再处理。'
emotion = "😒"

[[item]]
kind = "objection"
summary = "别浪费时间"
text = '别浪费时间了，\我们已经按流程处理了，您要证据就留着证据。'
emotion = "😠"

[[item]]
kind = "agreement"
summary = "我不耐烦了"
text = '我很忙，\如果不是严重问题就别来扰我。'
emotion = "😤"

[[item]]
kind = "objection"
summary = "这不是我们的错"
text = '这并非我们直接责任，\别把所有事都往我们这儿推。'
emotion = "😒"

[[item]]
kind = "agreement"
summary = "想要补偿？来证明"
text = '要补偿请拿出证据，\没有证据我们不会随便赔付。'
emotion = "😑"

[[item]]
kind = "objection"
summary = "别夸大事实"
text = '别把事情夸大，\说清楚具体情况才好办。'
emotion = "😒"

[[item]]
kind = "question"
summary = "真有那么严重吗？"
text = '您说得这么严重，\能不能先让我们看看实物或照片？'
emotion = "🤨"

[[item]]
kind = "agreement"
summary = "随便您怎样处理"
text = '既然您坚持这样说，\我们会记录但不会无缘无故把责任揽上。'
emotion = "😑"

[[item]]
kind = "objection"
summary = "我不负责这部分"
text = '我负责前台处理，\供应链问题请找采购去问。'
emotion = "😤"
gesture = "👉"

[[item]]
kind = "agreement"
summary = "别再来找我了"
text = '事情处理完您要是还不满意，\可以去找投诉部门，我这儿不再受理。'
emotion = "😒"

[[item]]
kind = "objection"
summary = "别耽误时间"
text = '别耽误大家时间，\把要点说清楚就行。'
emotion = "😠"

[[item]]
kind = "question"
summary = "还想要什么？"
text = '您还想要什么补救措施，\先把要求说清楚再说其他。'
emotion = "😑"
gesture = "❓"

[[item]]
kind = "agreement"
summary = "凭证拿来"
text = '要退钱就拿凭证来，\别光讲感受不拿证据。'
emotion = "😤"

[[item]]
kind = "objection"
summary = "别在这儿吵"
text = '别在这儿大声吵吵，\这不是解决问题的方式。'
emotion = "😠"

[[item]]
kind = "agreement"
summary = "行，那就算了"
text = '行，那就算了，\我们照程序记录，但别再来打扰。'
emotion = "😒"

[[item]]
kind = "question"
summary = "要不要我叫人？"
text = '要闹事的话我就叫保安，\还是先好好讲清楚？'
emotion = "😠"
gesture = "👉"

[[item]]
kind = "objection"
summary = "别做无谓指责"
text = '没有证据别随便指责，\讲事实我们才能处理。'
emotion = "🙄"
gesture = "✋"
