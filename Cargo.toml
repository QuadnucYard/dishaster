[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/dishaster-core"]

[workspace.package]
version = "0.1.0"
authors = ["QuadnucYard"]
rust-version = "1.89"
edition = "2024"

[workspace.dependencies]
dishaster-core = { path = "crates/dishaster-core" }

bevy_ecs = { version = "0.16", default-features = false, features = [
  "std",
  "backtrace",
] }
bevy_math = { version = "0.16", default-features = false, features = ["std"] }
glam = { version = "0.29", features = ["serde"] } # sync with bevy

derive_more = "1"
ecow = { version = "0.2", features = ["serde"] }
rand = "0.9"
rand_core = "0.9"
rand_chacha = "0.9"
ron = "0.11"
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
