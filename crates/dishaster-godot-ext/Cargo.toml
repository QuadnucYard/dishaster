[package]
name = "dishaster-godot-ext"
version.workspace = true
authors.workspace = true
rust-version.workspace = true
edition.workspace = true

[lib]
name = "dishaster"
crate-type = ["cdylib"] # Compile this crate to a dynamic C library.
test = false

[dependencies]
godot-binary-resource = { workspace = true, optional = true }
dishaster-godot.workspace = true

godot.workspace = true

[features]
default = []
production = ["dishaster-godot/production", "godot-binary-resource"]
trace = ["dishaster-godot/trace"]

